[package]
name = "audiotune"
version = "0.1.0"
edition = "2021"
description = "Phan tich am thanh chuyen nghiep va tu dong tinh EQ cho loa / tai nghe"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
cpal = "0.15"
realfft = "3.4"
rustfft = "6.2"
crossbeam-channel = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
